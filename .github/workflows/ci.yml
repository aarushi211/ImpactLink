name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline-eval:
    name: Offline evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impactlink-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: impactlink-backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Budget logic (offline, no API keys)
        run: python scripts/evaluate_logic.py --offline

      - name: Retrieval (offline keyword ranker)
        run: python scripts/evaluate_retrieval.py
